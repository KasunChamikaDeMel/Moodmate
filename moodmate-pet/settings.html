<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: #f9f9f9; }
        h3 { text-align: center; margin-top: 0; }
        label { display: block; margin-top: 20px; font-weight: bold; font-size: 14px; }
        input[type="range"] { width: 100%; margin-top: 10px; cursor: pointer; }
        .note { font-size: 12px; color: #666; margin-top: 30px; text-align: center; }
    </style>
</head>
<body>
    <h3>MoodMate Settings ⚙️</h3>

    <label>Size:</label>
    <input type="range" id="size-slider" min="100" max="500" value="300">

    <label>Transparency:</label>
    <input type="range" id="opacity-slider" min="0.2" max="1" step="0.1" value="1">

    <!-- <div class="switch-container"> -->
    <label style="margin:0;">Enable Pet Sound 🔊</label>
    <label class="switch">
        <input type="checkbox" id="sound-toggle" checked>
        <span class="slider"></span>
    </label>
    <!-- </div> -->

    <!-- BREAK REMINDER  -->
    <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd;">
        <h4 style="margin: 0 0 10px 0; color: #555;">⏰ Break Reminder</h4>
        
        <!-- On/Off Switch -->
        <div class="switch-container">
            <label style="margin:0;">Enable Timer</label>
            <label class="switch">
                <input type="checkbox" id="break-toggle">
                <span class="slider"></span>
            </label>
        </div>

        <!-- Time Input -->
        <label style="margin-top: 10px;">Remind every (minutes):</label>
        <input type="number" id="break-input" min="1" max="120" value="20" 
               style="padding: 8px; width: 90%; border-radius: 5px; border: 1px solid #ccc;">
    </div>

    <!-- ... end ... -->

    <p class="note">Changes apply immediately</p>


    <script>
        const { ipcRenderer } = require('electron');

        // --- Sound Logic ---
        const soundToggle = document.getElementById('sound-toggle');
        
        // Load Saved State
        const savedSound = localStorage.getItem('petSound');
        soundToggle.checked = savedSound !== 'false'; // Default is True

        soundToggle.addEventListener('change', (e) => {
            const isEnabled = e.target.checked;
            localStorage.setItem('petSound', isEnabled);
            // Send to Main -> Pet Window
            ipcRenderer.send('update-settings', { type: 'sound', value: isEnabled });
        });

        // Size change handler
        document.getElementById('size-slider').addEventListener('input', (e) => {
            ipcRenderer.send('update-settings', { type: 'size', value: e.target.value });
        });

        // Opacity change handler
        document.getElementById('opacity-slider').addEventListener('input', (e) => {
            ipcRenderer.send('update-settings', { type: 'opacity', value: e.target.value });
        });

        const breakToggle = document.getElementById('break-toggle');
        const breakInput = document.getElementById('break-input');

        // 1. Load Save  Settings 
        const savedBreakState = localStorage.getItem('breakEnabled') === 'true';
        const savedBreakTime = localStorage.getItem('breakTime') || 20;

        breakToggle.checked = savedBreakState;
        breakInput.value = savedBreakTime;
        
        // Input is disabled when Off
        breakInput.disabled = !savedBreakState;

        // 2. Toggle change event
        breakToggle.addEventListener('change', (e) => {
            const isEnabled = e.target.checked;
            breakInput.disabled = !isEnabled;
            
            localStorage.setItem('breakEnabled', isEnabled);
            sendBreakSettings();
        });

        // 3. When time changes
        breakInput.addEventListener('input', (e) => {
            localStorage.setItem('breakTime', e.target.value);
            sendBreakSettings();
        });

        // Main Function to Send Settings
        function sendBreakSettings() {
            ipcRenderer.send('update-settings', { 
                type: 'break', 
                enabled: breakToggle.checked,
                interval: parseInt(breakInput.value) // munits
            });
        }
    </script>
</body>
</html>
